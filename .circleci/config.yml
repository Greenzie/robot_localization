version: 2.1

orbs:
  greenzie: greenzie/build_and_publish_debs@0.1.2

parameters:
  manual-deploy:
    type: boolean
    default: false
  deploy_public:
    description: "Deploy only to greenzie-public-experimental (skips greenzie-experimental). For testing the public channel."
    type: boolean
    default: false

workflows:
  version: 2
  pushbuild:
    when:
      and:
        - not: << pipeline.parameters.manual-deploy >>
        - not: << pipeline.parameters.deploy_public >>
    jobs:
      - greenzie/debian_build_simple:
          name: "amd_debian_build"
          context: GREENZIE
          platform: amd64
          executor: greenzie/debianize_amd64
          generate_changelog: true

      - greenzie/debian_build_simple:
          name: "arm64_debian_build"
          context: GREENZIE
          platform: arm64
          executor: greenzie/debianize_arm64
          generate_changelog: true

  manualdeploy:
    when: << pipeline.parameters.manual-deploy >>
    jobs:
      - greenzie/debian_build_simple:
          name: "amd_debian_build"
          context: GREENZIE
          platform: amd64
          executor: greenzie/debianize_amd64
          generate_changelog: true

      - greenzie/debian_build_simple:
          name: "arm64_debian_build"
          context: GREENZIE
          platform: arm64
          executor: greenzie/debianize_arm64
          generate_changelog: true

      - greenzie/debian_deploy_experimental:
          name: "deploy_all_greenzie"
          context: GREENZIE
          requires:
            - amd_debian_build
            - arm64_debian_build

      - greenzie/debian_deploy_experimental_ssh:
          name: "deploy_to_public_experimental"
          context: GREENZIE
          repo_name: experimental-greenzie-public-focal-main
          channel: greenzie-public-experimental
          requires:
            - amd_debian_build
            - arm64_debian_build

  manualdeploy-public:
    when: << pipeline.parameters.deploy_public >>
    jobs:
      - greenzie/debian_build_simple:
          name: "amd_debian_build"
          context: GREENZIE
          platform: amd64
          executor: greenzie/debianize_amd64
          generate_changelog: true

      - greenzie/debian_build_simple:
          name: "arm64_debian_build"
          context: GREENZIE
          platform: arm64
          executor: greenzie/debianize_arm64
          generate_changelog: true

      - greenzie/debian_deploy_experimental_ssh:
          name: "deploy_to_public_experimental"
          context: GREENZIE
          repo_name: experimental-greenzie-public-focal-main
          channel: greenzie-public-experimental
          requires:
            - amd_debian_build
            - arm64_debian_build
